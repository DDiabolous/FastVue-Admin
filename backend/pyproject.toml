[project]
name = "fastvue-admin-backend"
version = "1.0.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23,<26", "email-validator>=2,<3",
  "redis>=5,<7", "PyJWT>=2.10.1,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
required-version = ">=0.12.18"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
