services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fastvue
      POSTGRES_USER: fastvue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastvue -d fastvue"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &api_environment
      DATABASE_URL: postgresql+asyncpg://fastvue:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/fastvue
      CORS_ORIGINS: '[]'
      ENVIRONMENT: production
      REDIS_URL: redis://redis:6379/0
      USER_JWT_SECRET: ${USER_JWT_SECRET:-}
      USER_JWT_ISSUER: ws-fastvue-user
      USER_AUTH_REDIS_PREFIX: fastvue:user:auth
      USER_REFRESH_TOKEN_DAYS: ${USER_REFRESH_TOKEN_DAYS:-7}
      USER_SMS_MOCK_ENABLED: ${USER_SMS_MOCK_ENABLED:-false}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  init:
    profiles: [tools]
    build: ./backend
    command: ["python", "-m", "app.cli", "init"]
    environment:
      <<: *api_environment
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: ./backend
    # Only the trusted Compose network can reach this port; nginx replaces XFF.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *api_environment
    # Dedicated outbound network permits HTTPS SMS gateways without exposing a host port.
    networks: [backend, api_egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [default, backend]
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
networks:
  api_egress: {}
  backend:
    internal: true
